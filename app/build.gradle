plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.davidg.outlander'
    compileSdk 34

    defaultConfig {
        applicationId 'com.davidg.outlander'
        minSdk 21
        targetSdk 28
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Mapa de OpenStreetMap (sin llave de API)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}
